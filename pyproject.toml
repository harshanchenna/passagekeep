[project]
name = "passagekeep"
version = "0.1.0"
description = "Turn an e-reader's My Clippings.txt export into a searchable, taggable highlights library with spaced-repetition review and Markdown export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
passagekeep = "passagekeep.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passagekeep"]
