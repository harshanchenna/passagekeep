<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Passagekeep{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 820px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    a { color: #2b5fa8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { margin-bottom: 1.5rem; display: flex; gap: 1rem; }
    .highlight { border-left: 3px solid #ddd; padding: 0.5rem 1rem; margin: 1rem 0; }
    .highlight blockquote { margin: 0.3rem 0; }
    .meta { color: #888; font-size: 0.85em; }
    .tag { display: inline-block; background: #eef; border-radius: 10px; padding: 1px 8px; margin-right: 4px; font-size: 0.8em; }
    form.inline { display: inline; }
    input[type=text] { padding: 4px; }
    button { cursor: pointer; }
    .book-list { list-style: none; padding: 0; }
    .book-list li { margin: 0.4rem 0; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Books</a>
    <a href="/review">Review</a>
    <form action="/search" method="get" class="inline">
      <input type="text" name="q" placeholder="Search highlights...">
      <button type="submit">Search</button>
    </form>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
